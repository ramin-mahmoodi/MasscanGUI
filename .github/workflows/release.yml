name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Static Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Static Qt 6 (MinGW UCRT)
        uses: orestonce/install-qt-static@v0.4.3
        with:
          version: 'Qt6.5.3-Windows-x86_64-MinGW13.2.0-ucrt-staticFull-20240527'

      - name: Configure CMake
        run: |
          cmake -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/qt_static_install/qt_install"

      - name: Build MasscanGUI
        run: cmake --build build --config Release

      - name: Strip Symbols and Package Release Archive
        shell: pwsh
        run: |
          $exeItem = Get-ChildItem -Path "build" -Recurse -Filter "MasscanGUI.exe" | Select-Object -First 1
          if (-not $exeItem) {
            Write-Error "MasscanGUI.exe was not found in build directory!"
            exit 1
          }
          $exe = $exeItem.FullName
          Write-Output "Found built binary at: $exe"

          # Strip any remaining debug/symbol tables using MinGW strip
          $stripCmd = Get-Command "strip.exe" -ErrorAction SilentlyContinue
          if ($stripCmd) {
            & $stripCmd.Source --strip-all $exe
          }

          $distDir = New-Item -ItemType Directory -Path "dist_package" -Force
          Copy-Item $exe -Destination $distDir.FullName -Force

          # Copy data folder alongside MasscanGUI.exe
          if (Test-Path "data") {
            Copy-Item -Recurse -Force "data" $distDir.FullName
          }

          # Verify static build: No DLL files should exist in the package
          $dlls = Get-ChildItem -Path $distDir.FullName -Recurse -Filter "*.dll"
          Write-Output "DLLs in package: $($dlls.Count)"
          if ($dlls.Count -gt 0) {
            Write-Error "Verification failed: DLLs found in static release package!"
            exit 1
          }

          $exeSize = (Get-Item (Join-Path $distDir.FullName "MasscanGUI.exe")).Length
          Write-Output "MasscanGUI.exe size: $([math]::Round($exeSize / 1MB, 2)) MB ($exeSize bytes)"

          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "MasscanGUI-$tag-windows-x64.zip"
          Write-Output "Archiving from $($distDir.FullName) to $zipName"
          Compress-Archive -Path "$($distDir.FullName)/*" -DestinationPath $zipName -Force
          $size = (Get-Item $zipName).Length
          Write-Output "Release archive created: $zipName ($([math]::Round($size / 1MB, 2)) MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MasscanGUI ${{ github.ref_name }}
          files: MasscanGUI-*-windows-x64.zip
          generate_release_notes: true
