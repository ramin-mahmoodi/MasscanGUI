name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT }}"

      - name: Build MasscanGUI
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exeItem = Get-ChildItem -Path "build" -Recurse -Filter "MasscanGUI.exe" | Select-Object -First 1
          if (-not $exeItem) {
            Write-Error "MasscanGUI.exe was not found in build directory!"
            exit 1
          }
          $exe = $exeItem.FullName
          $outDir = Split-Path -Parent $exe
          Write-Output "Deploying Qt to: $outDir for binary: $exe"

          & "${env:QT_ROOT}/bin/windeployqt.exe" --release --no-translations --no-compiler-runtime --no-opengl-sw $exe

          if (Test-Path "data") {
            Copy-Item -Recurse "data" "$outDir/data" -Force
          }
          exit 0

      - name: Package Release Archive
        shell: pwsh
        run: |
          $exeItem = Get-ChildItem -Path "build" -Recurse -Filter "MasscanGUI.exe" | Select-Object -First 1
          $outDir = Split-Path -Parent $exeItem.FullName
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "MasscanGUI-$tag-windows-x64.zip"
          Write-Output "Archiving from $outDir to $zipName"
          Compress-Archive -Path "$outDir/*" -DestinationPath $zipName -Force
          Write-Output "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MasscanGUI ${{ github.ref_name }}
          files: MasscanGUI-*-windows-x64.zip
          generate_release_notes: true
